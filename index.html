

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="mainBox">

        <h1>Student Expense Tracker</h1>
        <br>

        <h2>Add New Transaction</h2>

        <input type="text" id="expenseInput" placeholder="Enter name">

        <input type="number" id="expenseAmount" placeholder="Enter amount">

        <button id="addExpenseButton" onclick="addExpense()">
            Add Transaction
        </button>

        <div class="Income">
            <h2>Income List</h2>
            <ul id="incomeList"></ul>
            <p>Total Income: ₹<span id="income">0</span></p>
        </div>

        <div class="expenses">
            <h2>Expense List</h2>
            <ul id="expenseList"></ul>
            <p>Total Expenses: ₹<span id="totalExpense">0</span></p>
        </div>

        <div class="balance">
            <h2>Balance</h2>
            <p>Remaining Balance: ₹<span id="balance">0</span></p>
        </div>

    </div>

<script src="scrpit.js"></script>

</body>
</html>
